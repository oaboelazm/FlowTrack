project: runs/flowtrack
name: yolo_bdd100k_traffic
model: yolov8n.pt
data: configs/training/traffic_dataset.yaml
epochs: 80
imgsz: 960
batch: 16
device: 0
workers: 8
patience: 20
optimizer: auto
lr0: 0.01
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 3.0
close_mosaic: 10
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.3
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.05
copy_paste: 0.0
amp: true
plots: true
save: true
save_period: 5
pretrained: true
