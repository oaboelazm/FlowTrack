app:
  window_name: "FlowTrack - Real-Time Traffic Intelligence"
  display: true
  print_counts: false
  show_heatmap: false
  segment_playback_mode: true

source:
  input: "0"
  reconnect_delay_sec: 2.0
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/"
  referer: "https://www.earthcam.com/"
  chunk_mode: true
  chunk_seconds: 12
  first_chunk_seconds: 20
  chunk_queue_size: 3
  chunk_tmp_dir: "outputs/chunks"
  processed_chunk_dir: "outputs/processed_chunks"
  processed_chunk_reuse: false
  processed_chunk_slots: 2

model:
  weights: "PretrainedYolo26/Detect.pt"
  device: ""
  conf: 0.35
  iou: 0.45
  imgsz: 960
  half: false
  max_det: 300

classes:
  include:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck

segmentation:
  enabled: false
  weights: "PretrainedYolo26/Segment.pt"
  conf: 0.35
  iou: 0.45
  imgsz: 960
  half: false
  max_det: 200
  include_classes:
    - person
    - car
    - bus
    - truck

tracking:
  enabled: true
  tracker: "bytetrack.yaml"

line_counter:
  x1: 100
  y1: 360
  x2: 1180
  y2: 360
  cooldown_sec: 1.5

analytics:
  congestion_vehicle_threshold: 18
  congestion_hold_frames: 25
  stop_speed_px_per_sec: 10.0
  stop_duration_sec: 8.0
  meters_per_pixel: 0.05
  enable_heatmap: true

storage:
  enabled: true
  metrics_csv: "outputs/metrics.csv"
  events_csv: "outputs/crossings.csv"
  write_interval_sec: 1.0

runtime:
  frame_skip: 0
  resize_width: 1280
  resize_height: 720
